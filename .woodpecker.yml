when:
  branch: main
  event: push

steps:
  - name: install
    image: node:24-alpine
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile

  - name: check-and-test
    image: node:24-alpine
    commands:
      - corepack enable
      - pnpm run check
      - pnpm run test

  - name: build
    image: node:24-alpine
    commands:
      - corepack enable
      - pnpm run build

  - name: deploy
    image: appleboy/drone-ssh:1.7.3
    settings:
      host: community-hub.rpi-virtuell.net
      username: svc-cha
      key:
        from_secret: deploy_ssh_key
      script:
        # Das Server-Repo stand nach dem Merge von PR #3 noch auf dem
        # gelöschten Branch succesful-deployment; `git pull` im Deploy-Skript
        # fand keinen Upstream mehr (Pipeline 3 und 4, 14.09.2026). Deshalb
        # vorab main hart auf origin/main setzen, samt Tracking — idempotent.
        - cd ~/SourceCode/community-hub
        - echo "vorher:" && git status -sb | head -3 && git config --get branch.main.merge || true
        - git fetch origin main
        - git checkout -B main origin/main
        - git branch --set-upstream-to=origin/main main
        - echo "nachher:" && git status -sb | head -1
        - ~/ServerSetup/scripts/deploy-app.sh community-hub